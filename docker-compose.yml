services:
  # ==========================================
  # INFRAESTRUTURA DE QUALIDADE (WORKSHOP)
  # ==========================================
  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

  
  # 1. O Broker (Mensageria) - Exigência da Auditoria
  rabbitmq:
    image: rabbitmq:3-management
    container_name: topfrango_rabbitmq
    ports:
      - "5672:5672"   # Porta padrão de comunicação das filas (AMQP)
      - "15672:15672" # Porta do painel de monitoramento visual
    restart: always

  # 2. O Produtor de mensagens (Backend)
  backend:
    build: ./Servidor  
    container_name: topfrango_backend
    ports:
      - "5000:5000"
    volumes:
      - ./Servidor/topfrango.db:/app/topfrango.db
    environment:
      - RABBITMQ_URL=amqp://rabbitmq 
    depends_on:
      - rabbitmq
    restart: always

  # 3. O Consumidor Assíncrono (Worker)
  worker:
    build: ./Servidor
    command: node worker.js
    container_name: topfrango_worker
    volumes:
      - ./Servidor/topfrango.db:/app/topfrango.db
    environment:
      - RABBITMQ_URL=amqp://rabbitmq
    depends_on:
      - rabbitmq # Corrigido: movido de environment para depends_on
    restart: always

  # 4. Interface do Usuário (Frontend)
  frontend:
    build: ./sistema-pdv 
    container_name: topfrango_frontend
    ports:
      - "3000:3000"
    stdin_open: true 
    tty: true        
    depends_on:
      - backend 
    restart: always  

# Declaração dos volumes exigidos pelo SonarQube
volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: